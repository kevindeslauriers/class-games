<text x="18" y="77" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#111" xml:space="preserve"><tspan>    System.out.println(</tspan><tspan fill="#0a7a2f">"Strong"</tspan><tspan>);</tspan></text>
<text x="18" y="98" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#111" xml:space="preserve"><tspan>} </tspan><tspan fill="#1f4fd1" font-weight="bold">else</tspan><tspan> </tspan><tspan fill="#1f4fd1" font-weight="bold">if</tspan><tspan> (health >= 40) {</tspan></text>
<text x="18" y="119" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#111" xml:space="preserve"><tspan>    System.out.println(</tspan><tspan fill="#0a7a2f">"Wounded"</tspan><tspan>);</tspan></text>
<text x="18" y="140" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#111" xml:space="preserve"><tspan>} </tspan><tspan fill="#1f4fd1" font-weight="bold">else</tspan><tspan> </tspan><tspan fill="#1f4fd1" font-weight="bold">if</tspan><tspan> (health > 0) {</tspan></text>
<text x="18" y="161" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#111" xml:space="preserve"><tspan>    System.out.println(</tspan><tspan fill="#0a7a2f">"Critical"</tspan><tspan>);</tspan></text>
<text x="18" y="182" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#111" xml:space="preserve"><tspan>} </tspan><tspan fill="#1f4fd1" font-weight="bold">else</tspan><tspan> {</tspan></text>
<text x="18" y="203" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#111" xml:space="preserve"><tspan>    System.out.println(</tspan><tspan fill="#0a7a2f">"Defeated"</tspan><tspan>);</tspan></text>
<text x="18" y="224" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#111" xml:space="preserve"><tspan>}</tspan></text>
<text x="18" y="245" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#111" xml:space="preserve"><tspan>System.out.println(</tspan><tspan fill="#0a7a2f">"Health check done."</tspan><tspan>);</tspan></text>
