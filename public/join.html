<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1fb5">
<title>Class Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Lexend:wght@400;600;700&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--line:#3446c9;--gold:#ffcc33;--ok:#47e08a;--bad:#ff7a8a;--text:#fff;--soft:#c9d3ff;--team:#888;--card:rgba(15,26,107,.88)}
*,*::before,*::after{box-sizing:border-box}
html{background:#02030f}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#18268a 0%,#070b33 60%,#02030f 100%) fixed;color:var(--text);
  font-family:"Lexend",system-ui,sans-serif;font-size:clamp(16px,.55vw + 11px,21px);line-height:1.4}
[hidden]{display:none!important}
h1,h2{font-family:"Anton",sans-serif;font-weight:400;letter-spacing:.03em;margin:0;line-height:1.1}
h1{font-size:2.1em;color:var(--gold)}
h2{font-size:1.6em}
p{margin:0}
b{font-weight:700}

/* Layout: one column on phones, two on laptops */
#app{max-width:1180px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 28px;display:flex;flex-direction:column;gap:16px;min-height:100vh;min-height:100dvh}
#app:not(.joined){max-width:560px;justify-content:center}
.main{display:flex;flex-direction:column;gap:10px;min-width:0}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:900px){
  #app.joined{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,320px);grid-template-rows:auto 1fr;align-content:start;column-gap:22px;row-gap:16px}
  #app.joined .bar{grid-column:1 / -1}
}

/* Top bar */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;border-radius:14px;background:rgba(5,10,60,.75);border:2px solid var(--line);border-top:5px solid var(--team)}
.bar .brand{font-family:"Anton",sans-serif;letter-spacing:.06em;color:var(--gold);text-transform:uppercase;font-size:1.1em}
.bar .who{font-weight:700;font-size:1.1em;margin-left:auto}
.bar .tm{display:inline-flex;align-items:center;gap:8px;font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:3px 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.bar .mine{display:inline-flex;align-items:baseline;gap:6px}
.bar .mine small{color:var(--soft);font-size:.8em}
.bar .mine b{font-family:"Anton",sans-serif;font-weight:400;font-size:1.35em;letter-spacing:.03em}
@media (max-width:560px){.bar .brand{display:none}.bar .who{margin-left:0;flex:1}}
.dot{width:.8em;height:.8em;border-radius:50%;background:var(--team);display:inline-block;flex:none}

/* Cards */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
@media (max-width:560px){.card{padding:18px 16px;border-radius:14px}}
.label{font-family:"Oswald",sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-size:.8em}
.hint{color:var(--soft);font-size:.9em}
.hint.big,.big{font-size:1.1em}
.kbd{font-size:.8em;color:var(--soft)}
.status{color:var(--soft);font-size:.85em;text-align:center}
.toast{color:var(--bad);min-height:1.2em;font-weight:600}
.toast:empty{display:none}
.mates{color:var(--soft);font-size:.85em;padding:0 4px}
.neg{color:var(--bad)}.pos{color:var(--ok)}

/* Inputs and buttons */
.field{width:100%;font:inherit;font-size:1.1em;padding:.6em .8em;border-radius:12px;border:2px solid var(--line);background:#fff;color:#0b1255}
.field:focus{outline:3px solid var(--gold);outline-offset:1px}
.code{text-transform:uppercase;letter-spacing:.35em;font-family:"Anton",sans-serif;font-size:1.6em;text-align:center}
.btn{font:inherit;font-weight:700;padding:.65em 1.1em;border-radius:12px;border:2px solid #6f86ff;background:linear-gradient(#2e4bff,#0b1fa8);color:#fff;cursor:pointer;touch-action:manipulation}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(#ffe48a,#e0a800);color:#04155a;border-color:#ffe48a}
.btn.big{font-size:1.15em;padding:.75em}
.btn.small{font-size:.8em;padding:.35em .8em;align-self:center}
.linkbtn{font:inherit;font-size:.8em;background:none;border:0;color:var(--soft);text-decoration:underline;cursor:pointer;align-self:flex-start;padding:4px}
.row{display:flex;gap:10px;align-items:stretch}
.row .field{flex:1;min-width:0}

/* Join */
.joincard{gap:12px}
.logo{align-self:center;display:flex;flex-direction:column;align-items:center;font-size:2.6em;line-height:.9;color:#fff;
  background:radial-gradient(ellipse at 50% 30%,#3a5bff,#0a1fb5 70%);border:4px solid var(--gold);border-radius:50%;padding:.35em 1em;margin-bottom:6px;text-shadow:0 .06em 0 #000}
.logo small{font-size:.4em;color:var(--gold);letter-spacing:.12em}

/* Team picker */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,11.5em),1fr));gap:10px}
.teambtn{font:inherit;display:flex;align-items:center;gap:10px;padding:.8em 1em;border-radius:14px;border:3px solid var(--c);background:#0b1255;color:#fff;cursor:pointer;text-align:left}
.teambtn .dot{background:var(--c)}
.teambtn .n{flex:1;font-weight:700;font-size:1.05em}
.teambtn .cnt{font-family:"Oswald",sans-serif;font-weight:600;min-width:1.9em;text-align:center;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.12);font-size:.9em}
.teambtn:hover{filter:brightness(1.15)}
.teambtn.on{background:color-mix(in srgb,var(--c) 30%,#0b1255);box-shadow:0 0 0 3px var(--gold)}
.teambtn.on .n::after{content:" ✓";color:var(--gold)}

/* Waiting screens */
.wait{align-items:center;text-align:center;padding:40px 24px;gap:16px}
.wait .icon{width:3.2em;height:3.2em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Anton",sans-serif;font-size:1.8em;
  background:var(--team);box-shadow:0 0 0 6px rgba(255,255,255,.12);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07);box-shadow:0 0 0 12px rgba(255,255,255,.06)}}
@media (prefers-reduced-motion:reduce){.wait .icon{animation:none}}

/* Clues */
.cat{display:flex;justify-content:space-between;gap:10px;font-family:"Oswald",sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.cat b{font-family:"Anton",sans-serif;font-weight:400;color:var(--gold);letter-spacing:.03em;font-size:1.2em}
.q{font-size:1.45em;font-weight:600;line-height:1.35}
.q.small{font-size:1.05em;font-weight:400;color:var(--soft)}
sup{font-size:.62em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.choices{grid-template-columns:1fr}}
.choice{font:inherit;display:flex;align-items:center;gap:14px;text-align:left;min-height:3.6em;padding:.6em 1em;font-size:1.05em;font-weight:600;color:#fff;
  border-radius:14px;background:#0b1255;border:3px solid var(--line);cursor:pointer}
button.choice:hover:not(:disabled){border-color:#7d8fff;background:#13207a}
.choice:disabled{opacity:.45;cursor:default}
.choice .k{font-family:"Anton",sans-serif;font-weight:400;color:var(--gold);font-size:1.3em;width:1.1em;flex:none}
.choice.picked{border-color:var(--gold);background:#1b2a8a;opacity:1}
.choices.done .choice{cursor:default;min-height:2.8em;font-size:.95em}
.choice.right{border-color:var(--ok);background:#0c4a2b}
.choice.wrongpick{border-color:var(--bad);background:#4a0c1a}
.clock{display:flex;align-items:center;gap:12px}
.timer{flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#ff3b3b,#ffcc33);transform-origin:left}
.secs{font-family:"Anton",sans-serif;font-size:1.5em;min-width:2em;text-align:right}
.secs.low{color:var(--bad)}
.locked{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.08);border:2px dashed var(--soft)}
.result{font-family:"Anton",sans-serif;font-size:2.6em;letter-spacing:.03em;line-height:1}
.result.ok{color:var(--ok)}.result.no{color:var(--bad)}
.answer{font-size:1.25em}
.answer b{color:var(--gold)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:10px}
.facts div{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column}
.facts b{font-family:"Anton",sans-serif;font-weight:400;font-size:1.7em;letter-spacing:.02em;line-height:1.1}
.facts small{color:var(--soft)}
.wager{display:flex;flex-direction:column;gap:6px}

/* The board, when your team picks */
.mini{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.mini .col{display:flex;flex-direction:column;gap:8px}
.mini .h{font-family:"Oswald",sans-serif;font-weight:600;font-size:.7em;text-transform:uppercase;text-align:center;min-height:3.6em;display:flex;align-items:center;justify-content:center;
  background:#0a1fb5;border-radius:8px;padding:4px;line-height:1.1;overflow-wrap:anywhere}
.mini .val{padding:.55em 0;font-family:"Anton",sans-serif;font-weight:400;font-size:1.15em;color:var(--gold);background:linear-gradient(#1c34e0,#060f6e)}
@media (max-width:600px){.mini{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Side column */
.panel{background:rgba(5,10,60,.7);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.scores{display:grid;gap:6px}
.scores .t{display:grid;grid-template-columns:1.2em .8em 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.05)}
.scores .t.me{outline:2px solid var(--gold)}
.scores .rank{font-family:"Anton",sans-serif;color:var(--soft)}
.scores .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scores b{font-family:"Anton",sans-serif;font-weight:400;font-size:1.2em;letter-spacing:.02em}
.stats{flex-direction:row;justify-content:space-between;text-align:center}
.stats div{display:flex;flex-direction:column;flex:1}
.stats b{font-family:"Anton",sans-serif;font-weight:400;font-size:1.5em;letter-spacing:.02em}
.stats small{color:var(--soft);font-size:.72em}
.top{margin:0;padding-left:1.3em;display:grid;gap:4px}
.top li{padding-left:4px}
.top li b{float:right;font-family:"Anton",sans-serif;font-weight:400;letter-spacing:.02em}
</style>
</head>
<body>
<div id="app"></div>
<script src="/conn.js"></script>
<script src="/class-student.js"></script>
</body>
</html>
